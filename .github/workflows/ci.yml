name: DexFoundry CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dexfoundry
          POSTGRES_PASSWORD: dexfoundry
          POSTGRES_DB: dexfoundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dexfoundry -d dexfoundry"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://dexfoundry:dexfoundry@127.0.0.1:5432/dexfoundry
      DEXFOUNDRY_WEBHOOK_SECRET: ci-dexfoundry-proof-secret-0123456789abcdef
      DEXFOUNDRY_CALLBACK_URL: http://127.0.0.1:8787/workflow-results
      DEXFOUNDRY_RESULT_HOST: 127.0.0.1
      DEXFOUNDRY_RESULT_PORT: "8787"
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/webhook/dexfoundry-proof
      N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.39.7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and unit test
        run: npm run check
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Prove migrations are idempotent
        run: npm run db:migrate
      - name: Prove persistence and workflow-result idempotency
        run: npm run db:smoke
      - name: Prepare pinned n8n proof instance
        run: |
          docker pull "$N8N_IMAGE"
          docker volume create dexfoundry_n8n_data >/dev/null
          docker run --rm \
            -v dexfoundry_n8n_data:/home/node/.n8n \
            "$N8N_IMAGE" user-management:reset
          docker run --rm \
            -v dexfoundry_n8n_data:/home/node/.n8n \
            -v "$GITHUB_WORKSPACE/workflows/n8n:/workflows:ro" \
            "$N8N_IMAGE" import:workflow --input=/workflows/signed-proof-loop.json
          docker run --rm \
            -v dexfoundry_n8n_data:/home/node/.n8n \
            "$N8N_IMAGE" publish:workflow --id=DFProofN8n000001
      - name: Start n8n and DexFoundry result receiver
        run: |
          npm run results:serve > "$RUNNER_TEMP/dexfoundry-results.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dexfoundry-results.pid"
          docker run --rm --name dexfoundry-n8n --network host \
            -v dexfoundry_n8n_data:/home/node/.n8n \
            -e N8N_HOST=127.0.0.1 \
            -e N8N_PORT=5678 \
            -e N8N_PROTOCOL=http \
            -e N8N_SECURE_COOKIE=false \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -e N8N_BLOCK_ENV_ACCESS_IN_NODE=false \
            -e NODE_FUNCTION_ALLOW_BUILTIN=crypto \
            -e DEXFOUNDRY_WEBHOOK_SECRET="$DEXFOUNDRY_WEBHOOK_SECRET" \
            -e DEXFOUNDRY_CALLBACK_URL="$DEXFOUNDRY_CALLBACK_URL" \
            "$N8N_IMAGE" start > "$RUNNER_TEMP/n8n.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/n8n.pid"

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null && curl -fsS http://127.0.0.1:5678/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/healthz >/dev/null
          curl -fsS http://127.0.0.1:5678/healthz >/dev/null

          webhook_ready=false
          for i in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$N8N_WEBHOOK_URL" || true)"
            if [ "$status" != "404" ] && [ "$status" != "000" ]; then
              webhook_ready=true
              break
            fi
            sleep 1
          done
          if [ "$webhook_ready" != "true" ]; then
            echo "n8n became healthy but production webhook never registered"
            echo "DexFoundry result receiver log:"
            cat "$RUNNER_TEMP/dexfoundry-results.log" || true
            echo "n8n log:"
            cat "$RUNNER_TEMP/n8n.log" || true
            exit 1
          fi
      - name: Prove live n8n dispatch, signed callback, and duplicate delivery
        run: |
          proof_json="$(npm run --silent n8n:proof:seed)"
          idempotency_key="$(printf '%s' "$proof_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).idempotencyKey))")"
          npm run dispatch:once
          npm run n8n:proof:replay -- "$idempotency_key"
          npm run dispatch:once
          npm run n8n:proof:assert -- "$idempotency_key"
      - name: Show orchestration logs on failure
        if: failure()
        run: |
          echo "DexFoundry result receiver log:"
          cat "$RUNNER_TEMP/dexfoundry-results.log" || true
          echo "n8n log:"
          cat "$RUNNER_TEMP/n8n.log" || true
      - name: Stop orchestration proof processes
        if: always()
        run: |
          docker rm -f dexfoundry-n8n 2>/dev/null || true
          docker volume rm dexfoundry_n8n_data 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/n8n.pid" ]; then kill "$(cat "$RUNNER_TEMP/n8n.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/dexfoundry-results.pid" ]; then kill "$(cat "$RUNNER_TEMP/dexfoundry-results.pid")" 2>/dev/null || true; fi
