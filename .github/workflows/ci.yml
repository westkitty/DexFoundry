name: DexFoundry CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dexfoundry
          POSTGRES_PASSWORD: dexfoundry
          POSTGRES_DB: dexfoundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dexfoundry -d dexfoundry"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://dexfoundry:dexfoundry@127.0.0.1:5432/dexfoundry
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and unit test
        run: npm run check
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Prove migrations are idempotent
        run: npm run db:migrate
      - name: Prove persistence and workflow-result idempotency
        run: npm run db:smoke
